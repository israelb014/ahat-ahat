<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>אחת אחת</title>
  <meta name="description" content="מעקב בלחיצה אחת אחרי תינוק, ילד, קשיש או כל אדם">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="אחת אחת">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="ניווט">
    <button class="tab" data-tab="main" aria-label="ראשי"><span data-ic="home"></span></button>
    <button class="tab" data-tab="data" aria-label="נתונים"><span data-ic="chart"></span></button>
    <button class="tab" data-tab="settings" aria-label="הגדרות"><span data-ic="gear"></span></button>
  </nav>

  <div class="drawer-wrap" id="drawer" aria-hidden="true">
    <div class="backdrop" data-action="close-drawer"></div>
    <aside class="drawer" role="dialog" aria-label="פרופילים">
      <div class="drawer-head">
        <h2>פרופילים</h2>
        <button class="circle-btn" data-action="close-drawer" aria-label="סגירה"><span data-ic="close"></span></button>
      </div>
      <div class="group" id="drawerList"></div>
    </aside>
  </div>

  <div class="sheet-wrap" id="sheet" aria-hidden="true">
    <div class="backdrop" data-action="close-sheet"></div>
    <section class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grip"></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>

  <div class="onboard" id="onboard" aria-hidden="true"></div>

  <div class="sheet-wrap dialog-wrap" id="dialog" aria-hidden="true">
    <div class="backdrop dialog-backdrop"></div>
    <section class="sheet dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="sheet-grip"></div>
      <div class="sheet-body">
        <h3 id="dialogTitle"></h3>
        <p id="dialogText"></p>
        <div class="form-actions">
          <button class="btn-danger" id="dialogOk">אישור</button>
          <button class="btn-primary" id="dialogCancel">ביטול</button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
